[project]
name = "neurachat"
version = "1.0.0"
description = "A production-ready conversational AI assistant with streaming responses, conversation history and JWT auth."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "__pycache__", "app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.black]
line-length = 110
target-version = ["py311"]
exclude = 'app/static'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
